<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="appName">鱼酱书签助手</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <div class="app">
      <header class="top">
        <div class="brand">
          <img class="brand-mark" src="icons/icon128.png" alt="" width="36" height="36" />
          <div>
            <h1 data-i18n="brandTitle">书签管理助手</h1>
            <p class="tagline" data-i18n="tagline">搜得到 · 理得清 · 少踩坑</p>
          </div>
        </div>
        <div class="top-actions">
          <label class="lang-switch">
            <select id="lang-select" data-i18n-title="langLabel" title="语言" aria-label="语言">
              <option value="zh-CN">中文</option>
              <option value="en">English</option>
              <option value="fr">Français</option>
            </select>
          </label>
          <button type="button" class="icon-btn" id="btn-refresh" data-i18n-title="refresh" title="刷新" aria-label="刷新">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <path
                fill="currentColor"
                d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.75 10h-2.1A6 6 0 1 1 12 6c1.48 0 2.82.54 3.87 1.43L13 11h7V4l-2.35 2.35Z"
              />
            </svg>
          </button>
        </div>
      </header>

      <section class="stats" id="stats" aria-live="polite">
        <button type="button" class="stat is-link" id="stat-bookmarks-card" data-i18n-title="openTree" title="打开目录" data-tab="tree">
          <strong id="stat-bookmarks">—</strong><span data-i18n="statBookmarks">书签</span>
        </button>
        <button type="button" class="stat is-link" id="stat-folders-card" data-i18n-title="openTree" title="打开目录" data-tab="tree">
          <strong id="stat-folders">—</strong><span data-i18n="statFolders">文件夹</span>
        </button>
        <button type="button" class="stat is-link" id="stat-domains-card" data-i18n-title="openOverview" title="打开概况" data-tab="overview">
          <strong id="stat-domains">—</strong><span data-i18n="statDomains">域名</span>
        </button>
        <button
          type="button"
          class="stat warn is-link"
          id="stat-issues-card"
          data-i18n-title="openInsights"
          title="打开整理建议"
          data-tab="insights"
        >
          <strong id="stat-issues">—</strong>
          <span data-i18n="statPending">待处理</span>
        </button>
      </section>

      <label class="search">
        <span class="search-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20">
            <path
              fill="currentColor"
              d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5Zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14Z"
            />
          </svg>
        </span>
        <input
          id="search-input"
          type="search"
          data-i18n-placeholder="searchPlaceholder"
          placeholder="搜标题、网址或文件夹路径…"
          autocomplete="off"
          spellcheck="false"
        />
      </label>

      <nav class="tabs" role="tablist">
        <button type="button" class="tab is-active" data-tab="tree" role="tab" data-i18n="tabTree">目录</button>
        <button type="button" class="tab" data-tab="overview" role="tab" data-i18n="tabOverview">概况</button>
        <button type="button" class="tab" data-tab="insights" role="tab" data-i18n="tabInsights">整理建议</button>
        <button type="button" class="tab" data-tab="search" role="tab" data-i18n="tabSearch">搜索</button>
      </nav>

      <main class="panels">
        <section id="panel-tree" class="panel is-active" role="tabpanel">
          <p class="hint tree-hint" data-i18n="treeHint">拖到条目上下可排序；拖到文件夹中间可移入；悬停显示重命名 / 删除图标。</p>
          <div id="folder-tree" class="folder-tree"></div>
        </section>

        <section id="panel-overview" class="panel" role="tabpanel">
          <div class="card">
            <h2 data-i18n="domainDistribution">域名分布</h2>
            <ul class="domain-list" id="domain-list"></ul>
          </div>
          <div class="card">
            <h2 data-i18n="largeFolders">偏大的文件夹</h2>
            <ul class="simple-list" id="large-list"></ul>
          </div>
          <p class="hint" data-i18n="overviewHint">点「整理建议」可处理重复、空夹与重叠文件夹。</p>
        </section>

        <section id="panel-insights" class="panel" role="tabpanel">
          <p class="hint" id="insights-empty" hidden data-i18n="insightsEmpty">暂无整理建议，书签状态不错。</p>
          <div class="insight-block" id="block-dupes">
            <div class="insight-head">
              <h2 data-i18n="dupesTitle">重复网址</h2>
              <button type="button" class="btn ghost" id="btn-clean-dupes" hidden data-i18n="cleanDupes">一键去重</button>
            </div>
            <div id="list-dupes"></div>
          </div>
          <div class="insight-block" id="block-empty" hidden>
            <div class="insight-head">
              <h2 data-i18n="emptyFoldersTitle">空文件夹</h2>
              <button type="button" class="btn ghost" id="btn-clean-empty" hidden data-i18n="cleanEmpty">全部删除</button>
            </div>
            <div id="list-empty"></div>
          </div>
          <div class="insight-block" id="block-tiny" hidden>
            <div class="insight-head"><h2 data-i18n="tinyFoldersTitle">过小文件夹（≤2）</h2></div>
            <div id="list-tiny"></div>
          </div>
          <div class="insight-block" id="block-overlap" hidden>
            <div class="insight-head"><h2 data-i18n="overlapTitle">可能重叠</h2></div>
            <div id="list-overlap"></div>
          </div>
        </section>

        <section id="panel-search" class="panel" role="tabpanel">
          <div id="search-meta" class="meta"></div>
          <ul class="result-list" id="search-results"></ul>
        </section>
      </main>

      <div id="toast" class="toast" hidden></div>

      <dialog id="confirm-dialog">
        <form method="dialog" class="dialog-body">
          <h3 id="confirm-title" data-i18n="confirm">确认</h3>
          <p id="confirm-msg"></p>
          <div class="dialog-actions">
            <button type="submit" value="cancel" class="btn ghost" data-i18n="cancel">取消</button>
            <button type="submit" value="ok" class="btn danger" id="confirm-ok" data-i18n="confirm">确认</button>
          </div>
        </form>
      </dialog>

      <dialog id="move-dialog">
        <form method="dialog" class="dialog-body move-dialog-body">
          <h3 data-i18n="moveToFolder">移动到文件夹</h3>
          <p class="dialog-sub" id="move-target-label"></p>
          <input type="hidden" id="move-select" value="" />
          <div
            class="move-folder-list"
            id="move-folder-list"
            role="listbox"
            data-i18n-title="moveToFolder"
            tabindex="0"
          ></div>
          <div class="dialog-actions">
            <button type="submit" value="cancel" class="btn ghost" data-i18n="cancel">取消</button>
            <button type="submit" value="ok" class="btn primary" data-i18n="move">移动</button>
          </div>
        </form>
      </dialog>
    </div>
    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
