<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Promo A — WPS center</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { background: #0b1220; font-family: "Avenir Next", "Segoe UI", "PingFang SC", sans-serif; }
      #tile {
        width: 440px;
        height: 280px;
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        color: #fff;
        background:
          radial-gradient(ellipse 70% 55% at 20% 0%, rgba(255,255,255,0.32), transparent 55%),
          radial-gradient(ellipse 55% 60% at 100% 100%, rgba(30,27,75,0.5), transparent 58%),
          linear-gradient(105deg, #7dd3fc 0%, #38bdf8 16%, #3b82f6 42%, #2563eb 62%, #1d4ed8 80%, #312e81 100%);
      }
      #tile::before {
        content: "";
        position: absolute;
        inset: -45% -25% -55% -40%;
        background: repeating-radial-gradient(
          circle at 10% 120%,
          transparent 0, transparent 56px,
          rgba(255,255,255,0.13) 56px, rgba(255,255,255,0.13) 60px,
          transparent 60px, transparent 116px
        );
        pointer-events: none;
      }
      #tile::after {
        content: "";
        position: absolute;
        inset: 0;
        opacity: 0.32;
        mix-blend-mode: soft-light;
        pointer-events: none;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.6'/%3E%3C/svg%3E");
        background-size: 140px 140px;
      }
      .logo {
        position: relative;
        z-index: 1;
        width: 64px;
        height: 64px;
        border-radius: 16px;
        box-shadow: 0 10px 28px rgba(15, 23, 42, 0.28);
        margin-bottom: 18px;
      }
      .en {
        position: relative;
        z-index: 1;
        font-size: 30px;
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1.15;
        text-shadow: 0 2px 16px rgba(15, 23, 42, 0.18);
      }
      .zh {
        position: relative;
        z-index: 1;
        margin-top: 8px;
        font-size: 15px;
        font-weight: 600;
        opacity: 0.92;
      }
      .tag {
        position: relative;
        z-index: 1;
        margin-top: 14px;
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.02em;
        opacity: 0.88;
      }
    </style>
  </head>
  <body>
    <div id="tile">
      <img class="logo" src="../../icons/icon128.png" alt="" />
      <div class="en">Yujiang Bookmarks</div>
      <div class="zh">鱼酱书签助手</div>
      <div class="tag">Search · Deduplicate · Organize</div>
    </div>
  </body>
</html>
